spring.application.name=BetaBooks


spring.datasource.url=jdbc:postgresql://localhost:5432/beta_books

spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Gestione automatica dello schema
spring.jpa.hibernate.ddl-auto=update

# Genera fisicamente il file SQL con lo schema delle tabelle
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=drop-and-create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/define.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=src/main/resources/drop.sql
spring.jpa.properties.hibernate.schema_management_tool.script_source_strategy=drop-and-create

# Mostra le query SQL nella console di IntelliJ/Eclipse
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Specifica a Hibernate che stiamo usando le funzioni specifiche di Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.file=./jpa.log
logging.pattern.console=  %d{"yyyy/MM/dd HH:mm:ss,SSS"} [%p] [%t] %M\\(%F:%L\\) - %msg%n

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

springdoc.show-actuator=true
logging.level.org.springdoc=DEBUG

file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

