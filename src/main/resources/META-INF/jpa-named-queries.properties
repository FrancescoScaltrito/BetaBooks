libro.search = \
SELECT DISTINCT l \
FROM Libro l \
JOIN l.autore a \
JOIN l.editore e \
LEFT JOIN l.categorie c \
LEFT JOIN l.formati f \
WHERE ( \
    :query IS NULL OR \
    LOWER(l.titolo) LIKE LOWER(CONCAT('%', CAST(:query AS string), '%')) OR \
    LOWER(CONCAT(a.nome, ' ', a.cognome)) LIKE LOWER(CONCAT('%', CAST(:query AS string), '%')) OR \
    LOWER(CONCAT(a.cognome, ' ', a.nome)) LIKE LOWER(CONCAT('%', CAST(:query AS string), '%')) OR \
    LOWER(e.nome) LIKE LOWER(CONCAT('%', CAST(:query AS string), '%')) OR \
    LOWER(c.nome) LIKE LOWER(CONCAT('%', CAST(:query AS string), '%')) OR \
    f.isbn LIKE CONCAT('%', CAST(:query AS string), '%') \
) \
AND (:#{#categorie == null || #categorie.isEmpty()} = true OR c.nome IN :categorie) \
AND (:prezzoMin IS NULL OR EXISTS (SELECT 1 FROM FormatoLibro ff WHERE ff.libro = l AND ff.prezzo >= :prezzoMin)) \
AND (:prezzoMax IS NULL OR EXISTS (SELECT 1 FROM FormatoLibro ff WHERE ff.libro = l AND ff.prezzo <= :prezzoMax)) \
AND (:tipoSupporto IS NULL OR EXISTS (SELECT 1 FROM FormatoLibro ff WHERE ff.libro = l AND ff.tipoSupporto = :tipoSupporto)) \
AND (:tipoCopertina IS NULL OR EXISTS (SELECT 1 FROM FormatoLibro ff WHERE ff.libro = l AND ff.tipoCopertina = :tipoCopertina))